name: Publish DuoFramework to npm

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: Stable Git tag to verify against the public npm package
        required: true
        type: string
      check_signing:
        description: Sign a test archive from the tag without publishing it
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: duoframework-npm
  queue: max

jobs:
  publish:
    if: github.repository == 'JunaidUmar/DuoFrameworkBinary' && github.event_name == 'push' && !github.event.deleted
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: npm-production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Sign, publish, and verify the stable package
        env:
          UPM_ORGANIZATION_ID: ${{ vars.UPM_ORGANIZATION_ID }}
          UPM_SERVICE_ACCOUNT_KEY_ID: ${{ secrets.UPM_SERVICE_ACCOUNT_KEY_ID }}
          UPM_SERVICE_ACCOUNT_KEY_SECRET: ${{ secrets.UPM_SERVICE_ACCOUNT_KEY_SECRET }}
        run: python3 .github/scripts/publish-npm.py "$GITHUB_REF_NAME"

  verify:
    if: github.repository == 'JunaidUmar/DuoFrameworkBinary' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: npm-production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Compare the stable Git tag with npm
        if: inputs.check_signing == false
        env:
          STABLE_TAG: ${{ inputs.tag }}
        run: python3 .github/scripts/publish-npm.py "$STABLE_TAG" --verify-only
      - name: Test Unity signing without publishing
        if: inputs.check_signing
        env:
          STABLE_TAG: ${{ inputs.tag }}
          UPM_ORGANIZATION_ID: ${{ vars.UPM_ORGANIZATION_ID }}
          UPM_SERVICE_ACCOUNT_KEY_ID: ${{ secrets.UPM_SERVICE_ACCOUNT_KEY_ID }}
          UPM_SERVICE_ACCOUNT_KEY_SECRET: ${{ secrets.UPM_SERVICE_ACCOUNT_KEY_SECRET }}
        run: python3 .github/scripts/publish-npm.py "$STABLE_TAG" --sign-only
