name: Publish DuoFramework to npm

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: Stable Git tag to verify against the public npm package
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: duoframework-npm
  queue: max

jobs:
  publish:
    if: github.repository == 'JunaidUmar/DuoFrameworkBinary' && github.event_name == 'push' && !github.event.deleted
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: npm-production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Publish and verify the stable package
        run: python3 .github/scripts/publish-npm.py "$GITHUB_REF_NAME"

  verify:
    if: github.repository == 'JunaidUmar/DuoFrameworkBinary' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Compare the stable Git tag with npm
        env:
          STABLE_TAG: ${{ inputs.tag }}
        run: python3 .github/scripts/publish-npm.py "$STABLE_TAG" --verify-only
